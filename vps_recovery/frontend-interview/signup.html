<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create JobsQA Account</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/fevi.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center">

  <div class="bg-white w-full max-w-md p-8 rounded-xl shadow">
    <h1 class="text-2xl font-bold text-center mb-2">Create JobsQA Account</h1>
    <p id="subtitle" class="text-center text-gray-600 mb-6">
      Sign up to continue
    </p>

    <!-- ================= STEP 1: SIGNUP ================= -->
    <div id="signupStep">
      <input
        id="email"
        type="email"
        placeholder="Email"
        class="w-full border rounded-lg px-4 py-3 mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />

      <input
        id="password"
        type="password"
        placeholder="Password"
        class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />

      <button
        id="signupBtn"
        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
        Send OTP
      </button>
    </div>

    <!-- ================= STEP 2: OTP ================= -->
    <div id="otpStep" class="hidden">
      <input
        id="otp"
        type="text"
        maxlength="6"
        placeholder="Enter 6-digit OTP"
        class="w-full border rounded-lg px-4 py-3 mb-4 text-center tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />

      <button
        id="verifyBtn"
        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
        Verify OTP
      </button>
    </div>

    <!-- Message -->
    <p id="msg" class="mt-4 text-center text-sm"></p>

    <!-- Footer -->
    <div class="mt-6 text-center text-sm">
      Already have an account?
      <a href="/login.html" class="text-indigo-600 font-medium hover:underline">
        Login
      </a>
    </div>
  </div>

  <!-- ================= SCRIPT ================= -->
  <script>
    const signupBtn = document.getElementById("signupBtn");
    const verifyBtn = document.getElementById("verifyBtn");
    const msg = document.getElementById("msg");
    const subtitle = document.getElementById("subtitle");

    const signupStep = document.getElementById("signupStep");
    const otpStep = document.getElementById("otpStep");

    let signupEmail = "";

    // -------- STEP 1: SIGNUP + SEND OTP --------
    signupBtn.onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        msg.textContent = "Email and password are required";
        msg.style.color = "red";
        return;
      }

      signupBtn.disabled = true;
      msg.textContent = "Sending OTP to your email...";
      msg.style.color = "#333";

      try {
        const res = await fetch("/api/jobsqa/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const text = await res.text();
        let data;

        try {
          data = JSON.parse(text);
        } catch {
          throw new Error(text || "Signup failed");
        }

        if (!res.ok) {
          throw new Error(data.detail || "Signup failed");
        }

        signupEmail = email;

        // Switch to OTP step
        signupStep.classList.add("hidden");
        otpStep.classList.remove("hidden");
        subtitle.textContent = "Enter the OTP sent to your email";

        msg.textContent = "OTP sent successfully";
        msg.style.color = "green";

      } catch (err) {
        msg.textContent = err.message;
        msg.style.color = "red";
      } finally {
        signupBtn.disabled = false;
      }
    };

    // -------- STEP 2: VERIFY OTP --------
    verifyBtn.onclick = async () => {
      const otp = document.getElementById("otp").value.trim();

      if (!otp || !signupEmail) {
        msg.textContent = "Invalid state. Please sign up again.";
        msg.style.color = "red";
        return;
      }

      verifyBtn.disabled = true;
      msg.textContent = "Verifying OTP...";
      msg.style.color = "#333";

      try {
        const res = await fetch("/api/jobsqa/verify-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: signupEmail, otp })
        });

        const text = await res.text();
        let data;

        try {
          data = JSON.parse(text);
        } catch {
          throw new Error(text || "OTP verification failed");
        }

        if (!res.ok) {
          throw new Error(data.detail || "Invalid or expired OTP");
        }

        msg.textContent = "Email verified! Redirecting to login...";
        msg.style.color = "green";

        setTimeout(() => {
          window.location.href = "/login.html";
        }, 1000);

      } catch (err) {
        msg.textContent = err.message;
        msg.style.color = "red";
      } finally {
        verifyBtn.disabled = false;
      }
    };
  </script>

</body>
</html>
