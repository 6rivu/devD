<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard · JobsQA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ================= FAVICON ================= -->
<link rel="icon" type="image/png" href="/fevi.png">
<link rel="apple-touch-icon" href="/fevi.png">

</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

<!-- ================= HEADER ================= -->
<header class="bg-white shadow-sm">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <a href="/" class="flex items-center">
  <img
    src="logo.png"
    alt="JobsQA"
    class="h-10 w-auto"
  />
</a>


    <div class="flex items-center space-x-4">
  <div id="creditBox"
       class="text-sm font-medium bg-indigo-50 text-indigo-700 px-4 py-2 rounded-lg">
    Credits: --
  </div>

  <!-- 🔹 ADDED: Buy Credits -->
  <button
	  id="buyCreditsBtn"
	  onclick="buyCredits()"
	  class="hidden bg-orange-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-orange-600 transition">
	  <span id="priceDisplay">Buy Credits</span>
  </button>

  <button onclick="logout()"
          class="text-gray-600 hover:text-red-600 font-medium">
    Logout
  </button>
</div>

  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="flex-grow max-w-7xl mx-auto px-6 py-12">

  <h1 class="text-3xl font-bold mb-2">
    Generate Interview Q&A
  </h1>
  <p class="text-gray-600 mb-10">
    Upload your resume and paste the job description to get tailored interview questions.
  </p>

  <!-- ================= FORM ================= -->
  <div class="grid md:grid-cols-2 gap-10">

    <!-- LEFT: INPUTS -->
    <div class="bg-white p-8 rounded-xl shadow">

      <!-- Resume Upload -->
      <div class="mb-6">
        <label class="block font-medium mb-2">
          Upload Resume (PDF or DOCX)
        </label>
        <input
          type="file"
          id="resume"
          accept=".pdf,.docx"
          class="w-full border rounded-lg p-3"
        />
      </div>

      <!-- Job Description -->
      <div class="mb-6">
        <label class="block font-medium mb-2">
          Job Description
        </label>
        <textarea
          id="jobDescription"
          rows="8"
          placeholder="Paste the job description here..."
          class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        ></textarea>
      </div>

      <!-- Generate Button -->
      <button
        id="generateBtn"
        onclick="generateQA()"
        class="w-full bg-indigo-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-indigo-700 transition">
        Generate Interview Q&A
      </button>

      <!-- Loading -->
      <p id="loadingText" class="hidden text-center mt-4 text-indigo-600 font-medium">
        Generating interview Q&A...
      </p>

      <!-- Error -->
      <p id="errorText" class="hidden text-center mt-4 text-red-600 font-medium">
      </p>

    </div>

    <!-- RIGHT: OUTPUT -->
    <div class="bg-white p-8 rounded-xl shadow">
      <h2 class="text-xl font-semibold mb-4">
        Generated Interview Q&A
      </h2>

      <div id="output"
           class="text-gray-700 space-y-4 whitespace-pre-line text-sm">
        <p class="text-gray-400">
          Your interview questions and answers will appear here.
        </p>
      </div>

      <!-- Export Buttons -->
      <div id="exportButtons" class="hidden mt-6 flex space-x-4">
        <button onclick="downloadPDF()"
  class="border border-gray-300 px-4 py-2 rounded-lg hover:border-indigo-600">
  Download PDF
</button>
<button onclick="downloadDOCX()"
  class="border border-gray-300 px-4 py-2 rounded-lg hover:border-indigo-600">
  Download DOCX
</button>


      </div>

    </div>

  </div>
</main>

<!-- ================= FOOTER ================= -->
<footer class="bg-gray-900 text-gray-400 py-4 text-center text-sm">
  © 2026 JobsQA · Powered by CvolvePro
</footer>

<!-- ================= SCRIPT ================= -->
<script>
const token = localStorage.getItem("jwt_token");
if (!token) {
  window.location.href = "/login.html";
}
</script>


<script>
let userCountry = null;  // ✅ ADD THIS LINE - Global variable

async function detectCountryAndSetPrice() {
  try {
    const response = await fetch('https://ipapi.co/json/');
    const data = await response.json();
    
    userCountry = data.country_code;  // ✅ SAVE THE COUNTRY CODE
    
    if (data.country_code === 'IN') {
      document.getElementById('priceDisplay').textContent = "Buy Credits - ₹899";
    } else {
      document.getElementById('priceDisplay').textContent = "Buy Credits - $14.99";
    }
  } catch (error) {
    console.error('Failed to detect country:', error);
    userCountry = "US";  // ✅ DEFAULT TO US ON ERROR
    document.getElementById('priceDisplay').textContent = "Buy Credits - $14.99";
  }
}

detectCountryAndSetPrice();
</script>




<script>
async function loadCredits() {
  const token = localStorage.getItem("jwt_token");
  if (!token) return;

  try {
    const res = await fetch("https://jobsqa.com/api/jobsqa/me", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if (!res.ok) throw new Error("Failed to load credits");

    const data = await res.json();
    document.getElementById("creditBox").textContent =
      "Credits: " + data.credits;
	  
	  // 🔹 ADDED: show Buy Credits if exhausted
    document.getElementById("buyCreditsBtn").classList.remove("hidden");

  } catch (e) {
    console.error("Credits fetch failed", e);
    document.getElementById("creditBox").textContent = "Credits: 0";
  }
}

loadCredits();
</script>



<script>
let lastInterviewQA = "";
async function generateQA() {
  const resumeFile = document.getElementById("resume").files[0];
  const jobDescription = document.getElementById("jobDescription").value.trim();
  const token = localStorage.getItem("jwt_token");

  const errorText = document.getElementById("errorText");
  const loadingText = document.getElementById("loadingText");
  const output = document.getElementById("output");

  errorText.classList.add("hidden");

  if (!resumeFile || !jobDescription.trim()) {
    errorText.textContent = "Please upload resume and enter job description.";
    errorText.classList.remove("hidden");
    return;
  }

  loadingText.classList.remove("hidden");
  output.innerHTML = "";

  // 🔹 Convert resume → base64 (backend requirement)
  const resumeBase64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(resumeFile);
  });

  try {
    const res = await fetch("https://jobsqa.com/api/jobsqa/generate_interview_qa", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({
        resume_base64: resumeBase64,
        resume_filename: resumeFile.name,
        job_description: jobDescription
      })
    });

    const text = await res.text();
	let data;

	try {
	  data = JSON.parse(text);
	} catch (e) {
	  throw new Error(text || "Server error");
	}


    if (!res.ok) {
  if (res.status === 402) {
    document.getElementById("buyCreditsBtn").classList.remove("hidden");
    throw new Error("Credits exhausted. Please purchase credits to continue.");
  }
  throw new Error(data.detail || "Failed to generate Interview Q&A");
}


    // 🔹 Correct response field
    lastInterviewQA = data.interview_qa;   // ⭐ REQUIRED
	output.textContent = lastInterviewQA;
    document.getElementById("exportButtons").classList.remove("hidden");
	document.getElementById("creditBox").textContent = "Credits: " + data.credits;

  } catch (err) {
    errorText.textContent = err.message;
    errorText.classList.remove("hidden");
  } finally {
    loadingText.classList.add("hidden");
  }
}
</script>

<script>
function logout() {
  localStorage.removeItem("jwt_token");
  window.location.href = "/login.html";
}
</script>


<script>
function downloadPDF() {
  if (!lastInterviewQA) return;
  const win = window.open("", "_blank");
  win.document.write(`<pre>${lastInterviewQA}</pre>`);
  win.document.close();
  win.print();
}
</script>

<script>
async function downloadDOCX() {
  if (!lastInterviewQA) return;

  // 🔹 Load docx ONLY when user clicks
  if (!window.docx) {
    await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js";
      script.onload = resolve;
      script.onerror = reject;
      document.body.appendChild(script);
    });
  }

  const { Document, Packer, Paragraph } = window.docx;

  const lines = lastInterviewQA.split("\n").filter(l => l.trim());

  const doc = new Document({
    sections: [{
      children: lines.map(line =>
        new Paragraph({ text: line, spacing: { after: 200 } })
      )
    }]
  });

  const blob = await Packer.toBlob(doc);
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "Interview_QA.docx";
  a.click();

  URL.revokeObjectURL(url);
}
</script>


<script>
async function buyCredits() {
  const token = localStorage.getItem("jwt_token");
  if (!token) {
    window.location.href = "/login.html";
    return;
  }

  try {
    const res = await fetch("/api/jobsqa/create_checkout", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        country_code: userCountry || "US"  // Send detected country
      })
    });


    const text = await res.text();
    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(text || "Payment initialization failed");
    }

    if (!res.ok) {
      throw new Error(data.detail || "Unable to start payment");
    }

    // ✅ CRITICAL SAFETY CHECK
    if (!data.checkout_url) {
      throw new Error("Payment service unavailable. Please try again later.");
    }

    // 🔥 Redirect to Stripe Checkout
    window.location.href = data.checkout_url;

  } catch (err) {
    alert(err.message);
  }
}
</script>





</body>
</html>
