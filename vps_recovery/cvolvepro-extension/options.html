<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>CVolve Pro — Options</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body { font-family: Arial, sans-serif; margin:16px; color:#111; }
    h2 { margin-top:0; }
    .muted { color:#666; font-size:13px; }
    label { display:block; margin-top:12px; font-weight:600; }
    button { margin-top:12px; padding:8px 12px; border-radius:6px; cursor:pointer; }
    .small { font-size:13px; color:#444; margin-top:8px; }
  </style>
</head>
<body>
  <h2>CVolve Pro — Options</h2>

  <div class="muted">This extension uses sign-in (no API key required). Use the popup to sign in and buy credits on the website.</div>

  <div class="small">
    If you are an admin or developer and want to test with a direct token, you can paste a token below — otherwise leave it empty.
  </div>

  <label for="devToken">Development Token (optional)</label>
  <input id="devToken" type="text" placeholder="Paste test token here (optional)" style="width:100%; padding:8px; box-sizing:border-box;" />

  <div>
    <button id="saveBtn">Save</button>
    <button id="clearBtn" style="margin-left:8px;">Clear saved token</button>
  </div>

  <div class="small muted" id="msg"></div>

  <script src="options.js"></script>
</body>
</html>
