<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CVolve Pro</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --primary-1: #2274A5;
      --primary-2: #00A3FF;
      --muted: #6b7280;
      --text: #0f172a;
      --border: #e5e7eb;
      --bg-card: #ffffff;
      --surface: #f8fafc;
      --shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    body {
      margin: 0;
      padding: 16px;
      width: 360px;
      font-family: Inter, sans-serif;
      background: linear-gradient(180deg, rgba(34,116,165,0.05), rgba(0,163,255,0.05));
    }

    .card {
      background: var(--bg-card);
      padding: 16px;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    /* FIXED LOGO BOX */
    .logo-wrap {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      background: #fff;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* FIX: prevents stretching */
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .tag { font-size: 11px; color: var(--muted); }

    /* Input fields */
    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 13px;
    }

    textarea { min-height: 100px; resize: vertical; }

    label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-1), var(--primary-2));
      color: #fff;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    #status { font-size: 13px; color: var(--muted); margin-top: 10px; }

    footer { margin-top: 12px; display: flex; gap: 8px; }
  </style>
</head>

<body>
  <div class="card">
    <header>
      <!-- USE LOCAL LOGO FILE HERE -->
      <div class="logo-wrap">
        <img src="icon128.png" alt="logo" />
      </div>

      <div>
        <h1>CVolve Pro</h1>
        <div class="tag">Resumes Built to Get You Hired!</div>
      </div>
    </header>

    <!-- Everything else unchanged -->
    <div id="authWrapper">
      <button id="signinToggle" class="btn-ghost" style="padding:8px 10px; margin-bottom:6px;">
        <span id="signinLabel">Sign In</span>
        <span id="signinChevron">▾</span>
      </button>

      <div id="signinForm" style="display:none;">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@company.com" />

        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" />

        <div style="display:flex; gap:10px; margin-top:10px;">
          <button id="loginBtn" class="btn-primary btn">Login</button>
          <button id="guestBtn" class="btn-ghost btn">Guest</button>
        </div>
      </div>

      <div id="signedInBox" style="display:none; background:#f0f4ff; padding:10px; border-radius:10px; margin-bottom:8px;">
        <div>Signed in as <strong id="userEmail">-</strong></div>
        <div>Credits: <strong id="credits">-</strong></div>
        <button id="logoutBtn" class="btn-ghost btn" style="margin-top:10px;">Sign Out</button>
        <button id="buyBtn" class="btn-primary btn" style="margin-top:10px;">Buy Credits</button>
      </div>
    </div>

    <label>Upload Resume (PDF / DOCX)</label>
    <input id="resumeUpload" type="file" />

    <div id="resumeName" style="font-size:13px; margin-top:6px;"></div>

    <label style="margin-top:12px;">Job description</label>
    <textarea id="jobDesc"></textarea>

    <label style="margin-top:12px;">Target ATS %</label>
    <input id="targetMatch" type="number" value="90" />

    <button id="generateBtn" class="btn-primary btn" style="margin-top:14px;">
      🚀 Generate CV
    </button>
    <button id="generateCLBtn" class="btn btn-primary" style="margin-top:10px;">
      ✉️ Generate Cover Letter
    </button>

    <div id="clWrapper" style="display:none; margin-top:10px;">
  <label style="margin-bottom:6px; display:block;">Cover Letter preview</label>
  <textarea id="coverLetterPreview" readonly style="min-height:160px; width:100%; padding:10px; border-radius:8px; border:1px solid #e5e7eb; background:#fff;"></textarea>
  <div style="display:flex; gap:8px; margin-top:8px;">
    <button id="saveCLBtn" class="btn-ghost btn" style="flex:1;">Save to clipboard</button>
    <button id="downloadCLBtn" class="btn-primary btn" style="flex:1;">Download .docx</button>
  </div>
</div>

    <div id="status"></div>

    <footer>
      <button id="openOptions" class="btn-ghost btn">⚙️ Options</button>
      <button id="openSite" class="btn-ghost btn">Open Site</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
