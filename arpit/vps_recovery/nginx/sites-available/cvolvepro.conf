server {
    if ($host = www.cvolvepro.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = cvolvepro.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name cvolvepro.com www.cvolvepro.com;

    # optional: redirect / -> /app/
    location = / {
        return 301 /app/;
    }

    # Streamlit under /app/
    location /app/ {
        proxy_pass         http://127.0.0.1:8502/;
        proxy_http_version 1.1;

        # WebSocket/stream support
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Forward headers
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts (streamlit can hold long connections)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # (optional) serve a simple /health
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }




}
