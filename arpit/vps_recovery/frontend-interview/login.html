<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login · JobsQA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ================= FAVICON ================= -->
<link rel="icon" type="image/png" href="/fevi.png">
<link rel="apple-touch-icon" href="/fevi.png">

</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

<!-- ================= HEADER ================= -->
<header class="bg-white shadow-sm">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <a href="/" class="flex items-center">
  <img
    src="logo.png"
    alt="JobsQA"
    class="h-10 w-auto"
  />
</a>

    <a href="/" class="text-gray-600 hover:text-indigo-600 font-medium">
      Home
    </a>
  </div>
</header>

<!-- ================= LOGIN CARD ================= -->
<main class="flex-grow flex items-center justify-center px-6">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">

    <h1 class="text-3xl font-bold mb-2 text-center">
      Welcome Back
    </h1>
    <p class="text-gray-600 text-center mb-8">
      Login to generate personalized interview Q&A
    </p>

    <!-- Error Message -->
    <div id="errorBox"
         class="hidden bg-red-100 text-red-700 px-4 py-3 rounded mb-4 text-sm">
    </div>

    <!-- ================= LOGIN FORM ================= -->
    <form id="loginForm" class="space-y-6">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email Address
        </label>
        <input
          type="email"
          id="email"
          required
          placeholder="you@example.com"
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>
        <input
          type="password"
          id="password"
          required
          placeholder="••••••••"
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-indigo-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-indigo-700 transition">
        Login
      </button>
    </form>

    <!-- ================= FOOTER LINKS ================= -->
    <div class="text-center mt-6 text-sm text-gray-600">
      Don’t have an account?
      <a href="/signup.html">Create JobsQA account</a>
    </div>

  </div>
</main>

<!-- ================= FOOTER ================= -->
<footer class="bg-gray-900 text-gray-400 py-4 text-center text-sm">
  © 2026 JobsQA · Powered by CvolvePro
</footer>

<!-- ================= LOGIN SCRIPT ================= -->
<script>
  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("errorBox");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.add("hidden");

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("https://jobsqa.com/api/jobsqa/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
      });

      let data;
		const text = await res.text();

		try {
		  data = JSON.parse(text);
		} catch {
		  throw new Error("Server returned an unexpected response");
		}


      if (!res.ok) {
        throw new Error(data.detail || "Login failed");
      }

      // Save JWT
      localStorage.setItem("jwt_token", data.token);

      // Redirect to dashboard
      window.location.href = "/dashboard.html";

    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove("hidden");
    }
  });
</script>

</body>
</html>
